<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>THE BOARD</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161a19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="THE BOARD">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">
  <section id="login">
    <form id="login-form">
      <div id="login-card" class="login-card">
        <div class="board-frame">
          <h1 class="logo">THE BOARD</h1>
          <p class="logo-sub">pick'em against the spread</p>
        </div>
        <label for="password" class="sr-only">League password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="League password" required>
        <label class="remember"><input id="remember" type="checkbox" checked> Remember this device</label>
        <button id="unlock-btn" class="btn primary" type="submit">Unlock</button>
        <p id="login-error" class="login-error" role="alert"></p>
      </div>
    </form>
  </section>

  <div id="app-shell" hidden>
    <header class="topbar">
      <a href="#/standings" class="logo small">THE BOARD</a>
      <div class="top-actions">
        <button id="refresh-btn" class="icon-btn" title="Refresh scores" aria-label="Refresh scores">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>
        <button id="theme-btn" class="icon-btn" title="Theme: system / light / dark" aria-label="Change theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg></button>
        <a href="#/account" class="icon-btn" title="Your account" aria-label="Your account">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a>
        <a href="#/admin" class="icon-btn" title="Commissioner" aria-label="Commissioner">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z M14 6l4 4"/></svg></a>
        <button id="lock-btn" class="icon-btn" title="Lock" aria-label="Lock">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      </div>
    </header>
    <main id="view"></main>
    <p id="sync-status" class="sync-status"></p>
    <nav class="tabbar">
      <a href="#/standings" data-view="standings"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Standings</a>
      <a href="#/board" data-view="board"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="13" rx="1.5"/><path d="M9 21h6M7 9h5M7 13h8"/></svg>Picks</a>
      <a href="#/players" data-view="players"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.2 5 2.6 5 5.8"/></svg>Players</a>
      <a href="#/teams" data-view="teams"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Teams</a>
      <a href="#/stats" data-view="stats"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Stats</a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
